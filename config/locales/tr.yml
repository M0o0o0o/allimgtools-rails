    use_cases_1_body: "Etsy, Trendyol veya mağazanız için ürün fotoğraflarını toplu olarak sıkıştırın ve yeniden boyutlandırın. Her yüklemeden önce tek tek işlemeyi bırakın."
    use_cases_2_title: "Web ve İçerik Üreticileri"
    use_cases_2_body: "Daha hızlı sayfa yüklemesi için görsel dosya boyutlarını küçültün. Google PageSpeed puanını ve Core Web Vitals'ı iyileştirmek için JPEG'i WebP'ye dönüştürün."
    use_cases_3_title: "Gizlilik Bilincine Sahip Kullanıcılar"
    use_cases_3_body: "Fotoğrafları kamuya açık paylaşmadan önce GPS koordinatlarını, kamera modelini ve çekim tarihini silin. Paylaştıklarınız kontrolünüzde olmalı."
